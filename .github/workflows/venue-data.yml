# Keeps the site's venue data in step with the team's Google Sheet.
# - On demand (Actions tab > Venue data > Run workflow): download the sheet tabs, rebuild, commit if anything changed.
# - On any push that edits a data CSV or the build script: rebuild and commit the generated files.
name: Venue data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/*.csv", "tools/build_data.py"]

permissions:
  contents: write

concurrency:
  group: venue-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the Google Sheet
        if: github.event_name != 'push'
        run: python tools/sync_sheet.py
      - name: Rebuild venue data
        run: python tools/build_data.py
      - name: Commit generated files
        run: |
          git config user.name "venue-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/venues.csv data/venue-sections.csv data/rates.csv data/venues.js data/venues
          git diff --cached --quiet || (git commit -m "Sync venue data from the Google Sheet" && git push)
